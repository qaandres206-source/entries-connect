trigger:
  - main

variables:
  # ── Variables from Azure DevOps Variable Group ──
  # You need to define the following variables in the 'azure-static-web-apps-polite-mud-0442eb20f-variable-group' variable group:
  # - AZURE_SERVICE_CONNECTION_ID (your Azure service connection name)
  # - WEB_APP_NAME (the name of your Azure App Service)
  - group: 'azure-static-web-apps-polite-mud-0442eb20f-variable-group'

  # ── Inline variables (build config, no secrets) ──
  - name: ENVIRONMENT_NAME
    value: 'Production' # You can change this to 'Development' or another name if preferred
  - name: solution
    value: 'cwApp.sln'
  - name: serverProject
    value: 'cwApp/cwApp.csproj'
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '9.0.x'
  - name: publishOutput
    value: '$(Build.ArtifactStagingDirectory)/publish'

stages:
  # ─────────────────────────────────────────
  # BUILD STAGE
  # ─────────────────────────────────────────
  - stage: Build
    displayName: 'Build .NET 9 Blazor App'
    jobs:
      - job: BuildJob
        displayName: 'Restore, Build & Publish'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish server project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(serverProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(publishOutput)'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Upload artifact: drop'
            inputs:
              PathtoPublish: '$(publishOutput)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ─────────────────────────────────────────
  # DEPLOY STAGE
  # ─────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeploymentJob
        displayName: 'Deploy Blazor App'
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(ENVIRONMENT_NAME)'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure Web App: $(WEB_APP_NAME)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'ControlPanelPSA'
                    package: '$(Pipeline.Workspace)/drop/**/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'
