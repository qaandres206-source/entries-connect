trigger:
  - main

variables:
  # Azure Resource Manager connection created during pipeline setup
  azureServiceConnectionId: 'YOUR_SERVICE_CONNECTION_ID'

  # Azure Web App name (Windows or Linux App Service)
  webAppName: 'YOUR_WEB_APP_NAME'

  # Environment name (for approvals / deployment tracking)
  environmentName: 'YOUR_WEB_APP_NAME'

  # Solution / project paths
  solution: 'cwApp.sln'
  serverProject: 'cwApp/cwApp.csproj'

  # Build configuration
  buildConfiguration: 'Release'

  # .NET SDK version (matches cwApp.csproj TargetFramework net9.0)
  dotnetVersion: '9.0.x'

  # Publish output folder
  publishOutput: '$(Build.ArtifactStagingDirectory)/publish'

stages:
  # ─────────────────────────────────────────
  # BUILD STAGE
  # ─────────────────────────────────────────
  - stage: Build
    displayName: 'Build .NET 9 Blazor App'
    jobs:
      - job: BuildJob
        displayName: 'Restore, Build & Publish'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish server project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(serverProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(publishOutput)'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Upload artifact: drop'
            inputs:
              PathtoPublish: '$(publishOutput)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ─────────────────────────────────────────
  # DEPLOY STAGE
  # ─────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeploymentJob
        displayName: 'Deploy Blazor App'
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure Web App: $(webAppName)'
                  inputs:
                    azureSubscription: '$(azureServiceConnectionId)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/**/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'
