# ─────────────────────────────────────────────────────────────────────────
#  ControlPanelPSA — CI opcional (Azure DevOps)
#
#  IMPORTANTE: el DESPLIEGUE de esta aplicación se realiza en **Render**
#  (runtime Docker, ver ./Dockerfile y ./render.yaml). Azure DevOps se usa
#  únicamente como repositorio.
#
#  Por eso el trigger está en 'none': ningún push ejecuta este pipeline.
#  Queda disponible solo para ejecución MANUAL, como verificación de build.
# ─────────────────────────────────────────────────────────────────────────
trigger: none
pr: none

variables:
  - name: solution
    value: 'cwApp.sln'
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '9.0.x'

stages:
  - stage: Build
    displayName: 'Build ControlPanelPSA (.NET 9)'
    jobs:
      - job: BuildJob
        displayName: 'Restore & Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'
